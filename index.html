<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base Pong — Customizable</title>
  <style>
    :root {
      --bg: #0f172a;      /* slate-900 */
      --panel: #0b1229;   /* deep panel */
      --panel-2: #0f1a3c; /* alt panel */
      --ink: #e5e7eb;     /* gray-200 */
      --muted: #9ca3af;   /* gray-400 */
      --accent: #38bdf8;  /* sky-400 */
      --border: #243053;  /* blue-gray */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #1f2937 0%, var(--bg) 50%, #0b1026 100%);
      color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .wrap { width: min(980px, calc(100% - 2rem)); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    h1 { font-size: 1.1rem; letter-spacing: 0.02em; margin: 0; opacity: 0.9; }

    .toolbar {
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    }
    button, select, input[type="checkbox"] {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }

    .hint { opacity: 0.75; font-size: 0.9rem; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: .75rem;
    }

    @media (min-width: 880px) {
      .grid { grid-template-columns: 1.1fr .9fr; }
    }

    .panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: .85rem;
      box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.05);
    }

    canvas {
      width: 100%; height: auto; display: block; border-radius: 12px; background: #0a0f24;
    }

    .settings { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    .group { border: 1px dashed var(--border); border-radius: 10px; padding: .6rem; }
    .group h3 { margin: 0 0 .5rem 0; font-size: .95rem; color: var(--ink); opacity: .95; }

    .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .6rem; margin: .35rem 0; }
    .row label { color: var(--muted); font-size: .9rem; }

    input[type="color"] {
      appearance: none; border: 1px solid var(--border); width: 40px; height: 32px; padding: 0; background: transparent; border-radius: 8px; cursor: pointer;
    }
    input[type="range"] { width: 100%; }

    .kv { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Pong — Customizable Paddles</h1>
      <div class="toolbar">
        <button id="startBtn" title="Space">Start / Pause</button>
        <button id="resetBtn" title="R">Reset</button>
        <label class="hint">Speed:
          <select id="speedSelect">
            <option value="1">1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5" selected>1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>
      </div>
    </header>

    <div class="grid">
      <div class="panel">
        <!-- Fixed internal resolution; CSS scales responsively -->
        <canvas id="game" width="900" height="520" aria-label="Pong game field"></canvas>
        <p class="hint">Left: W / S · Right: ↑ / ↓ · Space: Start/Pause · R: Reset</p>
      </div>

      <div class="panel">
        <div class="settings">
          <div class="group">
            <h3>Colors</h3>
            <div class="row">
              <label for="leftColor">Left paddle</label>
              <input id="leftColor" type="color" value="#e5e7eb" />
            </div>
            <div class="row">
              <label for="rightColor">Right paddle</label>
              <input id="rightColor" type="color" value="#e5e7eb" />
            </div>
          </div>

          <div class="group">
            <h3>Shape</h3>
            <div class="row">
              <label for="paddleWidth">Width (<span class="kv" id="wVal">14</span>px)</label>
              <input id="paddleWidth" type="range" min="6" max="26" step="1" value="14" />
            </div>
            <div class="row">
              <label for="paddleHeight">Height (<span class="kv" id="hVal">90</span>px)</label>
              <input id="paddleHeight" type="range" min="50" max="200" step="1" value="90" />
            </div>
            <div class="row">
              <label for="paddleRadius">Corner radius (<span class="kv" id="rVal">10</span>px)</label>
              <input id="paddleRadius" type="range" min="0" max="20" step="1" value="10" />
            </div>
          </div>

          <div class="group">
            <h3>Control</h3>
            <div class="row">
              <label for="paddleSpeed">Paddle speed (<span class="kv" id="sVal">8.5</span>)</label>
              <input id="paddleSpeed" type="range" min="5" max="14" step="0.1" value="8.5" />
            </div>
            <div class="row">
              <label for="aiToggle">Simple AI on right</label>
              <input id="aiToggle" type="checkbox" checked />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === Pong with Customizable Paddles ===
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // UI elements
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const speedSelect = document.getElementById('speedSelect');

    const leftColorEl = document.getElementById('leftColor');
    const rightColorEl = document.getElementById('rightColor');
    const widthEl = document.getElementById('paddleWidth');
    const heightEl = document.getElementById('paddleHeight');
    const radiusEl = document.getElementById('paddleRadius');
    const speedEl = document.getElementById('paddleSpeed');
    const aiEl = document.getElementById('aiToggle');

    const wVal = document.getElementById('wVal');
    const hVal = document.getElementById('hVal');
    const rVal = document.getElementById('rVal');
    const sVal = document.getElementById('sVal');

    // Persistent settings
    const defaultSettings = {
      leftColor: '#e5e7eb',
      rightColor: '#e5e7eb',
      paddleWidth: 14,
      paddleHeight: 90,
      paddleRadius: 10,
      paddleSpeed: 8.5,
      ai: true,
      speedMul: parseFloat(speedSelect.value)
    };

    let settings = loadSettings();

    function loadSettings() {
      try {
        const raw = localStorage.getItem('pongSettings');
        if (!raw) return { ...defaultSettings };
        const data = JSON.parse(raw);
        return { ...defaultSettings, ...data };
      } catch { return { ...defaultSettings }; }
    }
    function saveSettings() { localStorage.setItem('pongSettings', JSON.stringify(settings)); }

    // Game objects
    let left = { x: 28, y: H/2 - settings.paddleHeight/2, w: settings.paddleWidth, h: settings.paddleHeight, dy: 0, color: settings.leftColor };
    let right = { x: W - 28 - settings.paddleWidth, y: H/2 - settings.paddleHeight/2, w: settings.paddleWidth, h: settings.paddleHeight, dy: 0, color: settings.rightColor };

    const BALL_R = 9;
    let ball = { x: W/2, y: H/2, r: BALL_R, dx: 0, dy: 0 };

    // Rules
    let running = false;
    let lastTime = 0;
    let leftScore = 0;
    let rightScore = 0;

    // Helpers
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const randSign = () => Math.random() < 0.5 ? -1 : 1;

    function serve(direction = randSign()) {
      ball.x = W/2; ball.y = H/2;
      const angle = (Math.random()*0.6 - 0.3); // -0.3..0.3 rad
      const base = 4.2 * settings.speedMul;
      ball.dx = Math.cos(angle) * base * direction;
      ball.dy = Math.sin(angle) * (base * 0.8);
    }

    function reset() {
      leftScore = rightScore = 0;
      left.y = H/2 - left.h/2;
      right.y = H/2 - right.h/2;
      serve(randSign());
    }

    function applySettings() {
      // sync paddles
      left.w = settings.paddleWidth; left.h = settings.paddleHeight; left.color = settings.leftColor;
      right.w = settings.paddleWidth; right.h = settings.paddleHeight; right.color = settings.rightColor;
      // keep on field
      left.y = clamp(left.y, 0, H - left.h);
      right.y = clamp(right.y, 0, H - right.h);
      // UI mirrors
      leftColorEl.value = settings.leftColor;
      rightColorEl.value = settings.rightColor;
      widthEl.value = settings.paddleWidth; wVal.textContent = settings.paddleWidth;
      heightEl.value = settings.paddleHeight; hVal.textContent = settings.paddleHeight;
      radiusEl.value = settings.paddleRadius; rVal.textContent = settings.paddleRadius;
      speedEl.value = settings.paddleSpeed; sVal.textContent = settings.paddleSpeed.toFixed(1);
      aiEl.checked = settings.ai;
      speedSelect.value = String(settings.speedMul);
      saveSettings();
    }

    // Draw helpers
    function clear() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0f24');
      g.addColorStop(1, '#0a0c1a');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function drawNet() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.setLineDash([8, 16]);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(W/2, 16);
      ctx.lineTo(W/2, H-16);
      ctx.stroke();
      ctx.restore();
    }

    function drawPaddle(p) {
      ctx.fillStyle = p.color;
      roundedRect(p.x, p.y, p.w, p.h, settings.paddleRadius);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 16;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    function drawScore() {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '700 42px system-ui,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'center';
      ctx.fillText(String(leftScore), W * 0.25, 60);
      ctx.fillText(String(rightScore), W * 0.75, 60);
    }

    function aiMove() {
      if (!settings.ai) return;
      const target = ball.y - right.h / 2;
      const speed = 6 * settings.speedMul; // AI limit
      const dir = clamp(target - right.y, -speed, speed);
      right.y = clamp(right.y + dir, 0, H - right.h);
    }

    // Input
    const keys = new Set();
    window.addEventListener('keydown', (e) => {
      keys.add(e.code);
      if (e.code === 'Space') toggle();
      if (e.code === 'KeyR') { reset(); running = false; }
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    function handleInput(dt) {
      const padSpeed = settings.paddleSpeed * settings.speedMul;
      if (keys.has('KeyW')) left.y -= padSpeed;
      if (keys.has('KeyS')) left.y += padSpeed;
      if (keys.has('ArrowUp')) right.y -= padSpeed; // manual override
      if (keys.has('ArrowDown')) right.y += padSpeed;
      left.y = clamp(left.y, 0, H - left.h);
      right.y = clamp(right.y, 0, H - right.h);
    }

    // Physics & collisions
    function update(dt) {
      handleInput(dt);
      aiMove();

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y - ball.r <= 0 && ball.dy < 0) { ball.y = ball.r; ball.dy *= -1; }
      if (ball.y + ball.r >= H && ball.dy > 0) { ball.y = H - ball.r; ball.dy *= -1; }

      function collide(p) {
        if (ball.x - ball.r < p.x + p.w && ball.x + ball.r > p.x && ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h) {
          const hitPos = (ball.y - (p.y + p.h/2)) / (p.h/2); // -1..1
          const angle = hitPos * (Math.PI/3.5);
          const dir = (p === left) ? 1 : -1;
          const speed = Math.min(Math.hypot(ball.dx, ball.dy) * 1.05, 16 * settings.speedMul);
          ball.dx = Math.cos(angle) * speed * dir;
          ball.dy = Math.sin(angle) * speed;
          if (dir === 1) ball.x = p.x + p.w + ball.r + 0.1; else ball.x = p.x - ball.r - 0.1;
        }
      }
      collide(left); collide(right);

      if (ball.x + ball.r < 0) { rightScore++; serve(1); }
      else if (ball.x - ball.r > W) { leftScore++; serve(-1); }
    }

    function render() {
      clear(); drawNet(); drawPaddle(left); drawPaddle(right); drawBall(); drawScore();
      if (!running) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '700 26px system-ui,Segoe UI,Roboto,Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Press Space or Click Start to Play', W/2, H/2 - 12);
        ctx.font = '500 16px system-ui,Segoe UI,Roboto,Arial';
        ctx.fillText('Customize paddles on the right →', W/2, H/2 + 18);
      }
    }

    function loop(ts) {
      const dt = (ts - lastTime) / 16.6667; lastTime = ts;
      if (running) update(dt);
      render();
      requestAnimationFrame(loop);
    }
    function toggle() { running = !running; }

    // UI wiring
    startBtn.addEventListener('click', toggle);
    resetBtn.addEventListener('click', () => { reset(); running = false; });
    speedSelect.addEventListener('change', (e) => { settings.speedMul = parseFloat(e.target.value); saveSettings(); });

    leftColorEl.addEventListener('input', (e) => { settings.leftColor = e.target.value; applySettings(); });
    rightColorEl.addEventListener('input', (e) => { settings.rightColor = e.target.value; applySettings(); });
    widthEl.addEventListener('input', (e) => { settings.paddleWidth = parseInt(e.target.value, 10); wVal.textContent = settings.paddleWidth; right.x = W - 28 - settings.paddleWidth; applySettings(); });
    heightEl.addEventListener('input', (e) => { settings.paddleHeight = parseInt(e.target.value, 10); hVal.textContent = settings.paddleHeight; applySettings(); });
    radiusEl.addEventListener('input', (e) => { settings.paddleRadius = parseInt(e.target.value, 10); rVal.textContent = settings.paddleRadius; saveSettings(); });
    speedEl.addEventListener('input', (e) => { settings.paddleSpeed = parseFloat(e.target.value); sVal.textContent = settings.paddleSpeed.toFixed(1); saveSettings(); });
    aiEl.addEventListener('change', (e) => { settings.ai = e.target.checked; saveSettings(); });

    // Boot
    applySettings();
    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
